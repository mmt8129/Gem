<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haber Akışı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/Gem/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f8f9fa;
            --text: #111111;
            --text-secondary: #555555;
            --text-muted: #888888;
            --accent: #0d6efd;
            --accent-light: #e8f0fe;
            --border: #e5e5e5;
            --danger: #dc3545;
            --success: #198754;
            --star: #f0c040;
            --header-h: auto;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* HEADER */
        .header {
            flex-shrink: 0;
            padding: 12px 16px 8px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            z-index: 50;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .header-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            cursor: pointer;
        }
        .header-actions {
            display: flex;
            gap: 6px;
        }
        .btn-icon {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            position: relative;
        }
        .btn-icon:active {
            background: var(--text);
            color: var(--bg);
        }
        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: #fff;
            font-size: 0.55rem;
            padding: 2px 5px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
            min-width: 15px;
            text-align: center;
        }
        .badge.show {
            display: block;
        }

        /* SEARCH BAR */
        .search-bar {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.82rem;
            font-family: 'Inter', sans-serif;
            background: var(--surface);
            outline: none;
            transition: border-color 0.2s ease;
        }
        .search-input:focus {
            border-color: var(--accent);
        }
        .btn-search {
            padding: 10px 16px;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn-search:active {
            background: var(--text);
            color: #fff;
        }

        /* CATEGORY NAV */
        .category-nav {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 4px 0;
        }
        .category-nav::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 7px 13px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-secondary);
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            letter-spacing: 0.02em;
        }
        .cat-btn.active {
            background: var(--text);
            color: #fff;
            border-color: var(--text);
        }

        /* NEWS LIST */
        .news-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 4px 16px 16px;
        }
        .news-item {
            display: flex;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: opacity 0.15s ease;
            align-items: flex-start;
        }
        .news-item:active {
            opacity: 0.6;
        }
        .news-img {
            width: 68px;
            height: 68px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--surface);
            flex-shrink: 0;
        }
        .news-content {
            flex: 1;
            min-width: 0;
        }
        .news-source {
            font-size: 0.66rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .news-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-meta {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* EMPTY / LOADING */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* LOAD MORE */
        .load-more {
            text-align: center;
            padding: 20px;
        }
        .btn-load {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 12px 24px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.03em;
        }
        .btn-load:active {
            background: var(--text);
            color: #fff;
        }

        /* SEARCH RESULTS */
        .search-results {
            padding: 8px 0;
        }
        .search-result-count {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent);
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }
        .search-result-item {
            display: flex;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            align-items: flex-start;
        }
        .search-result-item:active {
            opacity: 0.6;
        }
        .search-result-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--surface);
            flex-shrink: 0;
        }
        .search-result-title {
            font-size: 0.82rem;
            font-weight: 600;
            line-height: 1.3;
        }
        .search-result-source {
            font-size: 0.65rem;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-top: 2px;
        }

        /* DETAIL PAGE */
        .detail-page {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: none;
            flex-direction: column;
            max-width: 480px;
            margin: 0 auto;
        }
        .detail-page.show {
            display: flex;
        }
        .detail-scroll {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 160px;
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
        }
        .btn-back {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .detail-source-badge {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .detail-body {
            padding: 16px;
        }
        .detail-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            background: var(--surface);
            margin-bottom: 16px;
        }
        .detail-category {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .detail-title {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
        }
        .detail-meta {
            font-size: 0.73rem;
            color: var(--text-muted);
            margin-bottom: 18px;
        }
        .detail-divider {
            height: 2px;
            background: var(--text);
            opacity: 0.1;
            margin-bottom: 18px;
        }
        .detail-text {
            font-size: 0.88rem;
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .detail-text p {
            margin-bottom: 12px;
        }

        /* AI BANNER (fixed bottom) */
        .ai-banner {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            border-top: 2px solid var(--border);
            z-index: 110;
            display: flex;
            flex-direction: column;
            max-height: 50vh;
            transition: max-height 0.3s ease;
        }
        .ai-banner.expanded {
            max-height: 70vh;
        }
        .ai-banner-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .ai-banner-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ai-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .btn-summarize {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 7px 12px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: all 0.15s ease;
        }
        .btn-summarize:active {
            opacity: 0.8;
            transform: scale(0.96);
        }
        .btn-summarize:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .ai-banner-body {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 8px;
            font-size: 0.82rem;
            line-height: 1.6;
            display: none;
        }
        .ai-banner-body.show {
            display: block;
        }
        .ai-banner-body p {
            margin-bottom: 6px;
        }
        .ai-summary-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.78rem;
            padding: 8px 0;
        }
        .ai-chat-input-row {
            display: flex;
            gap: 6px;
            padding: 8px 16px 12px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            display: none;
        }
        .ai-chat-input-row.show {
            display: flex;
        }
        .ai-chat-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.78rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            background: var(--surface);
        }
        .ai-chat-input:focus {
            border-color: var(--accent);
        }
        .btn-ai-send {
            width: 36px;
            height: 36px;
            border: 1px solid var(--text);
            background: var(--text);
            color: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-ai-send:active {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            background: var(--bg);
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .modal-header h2 {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .modal-close {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        /* FORMS */
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }
        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-input:focus,
        .form-select:focus {
            border-color: var(--accent);
        }

        /* BUTTONS */
        .btn {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: all 0.15s ease;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            flex: 1;
            text-align: center;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-danger {
            color: var(--danger);
            border-color: var(--danger);
        }
        .btn-danger:active {
            background: var(--danger);
            color: #fff;
        }
        .btn-sm {
            font-size: 0.66rem;
            padding: 6px 12px;
            border-radius: 8px;
            letter-spacing: 0.03em;
        }

        /* RSS ITEM */
        .rss-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            gap: 10px;
            background: var(--bg);
        }
        .rss-item-info {
            flex: 1;
            min-width: 0;
        }
        .rss-item-name {
            font-size: 0.8rem;
            font-weight: 600;
            display: block;
        }
        .rss-item-cat {
            font-size: 0.65rem;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        .rss-item-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .rss-item-actions .btn-sm {
            flex: none;
            min-width: 32px;
        }

        /* SAVED ITEM */
        .saved-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            gap: 10px;
        }
        .saved-item:active {
            opacity: 0.6;
        }
        .saved-item-info {
            flex: 1;
            min-width: 0;
        }
        .saved-item-source {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .saved-item-title {
            font-size: 0.82rem;
            font-weight: 600;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        @media (display-mode: standalone) {
            body {
                padding-top: env(safe-area-inset-top);
            }
            .ai-banner {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>

    <!-- ANA SAYFA -->
    <div id="mainPage" style="display:flex;flex-direction:column;height:100%;overflow:hidden;">
        <header class="header">
            <div class="header-top">
                <span class="header-title" onclick="openSettingsModal()">📰 Haber Akışı</span>
                <div class="header-actions">
                    <button class="btn-icon" onclick="openSavedModal()" title="Kaydedilenler">
                        ☆
                        <span class="badge" id="savedBadge">0</span>
                    </button>
                    <button class="btn-icon" onclick="refreshNews()" title="Yenile">🔄</button>
                </div>
            </div>
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="Haberlerde ara..." onkeypress="if(event.key==='Enter')doSearch()" autocomplete="off">
                <button class="btn-search" onclick="doSearch()">🔍 Ara</button>
            </div>
            <nav class="category-nav" id="categoryNav"></nav>
        </header>
        <div class="news-list" id="newsList">
            <div class="loading"><div class="spinner"></div>Yükleniyor...</div>
        </div>
    </div>

    <!-- DETAY SAYFASI -->
    <div class="detail-page" id="detailPage">
        <div class="detail-header">
            <button class="btn-back" onclick="closeDetail()">←</button>
            <span class="detail-source-badge" id="detailSource"></span>
            <div style="flex:1;"></div>
            <button class="btn-icon" id="detailStarBtn" onclick="toggleDetailStar()" style="color:var(--text);">☆</button>
        </div>
        <div class="detail-scroll" id="detailScroll">
            <div class="detail-body">
                <img class="detail-img" id="detailImage" src="" alt="" onerror="this.style.display='none';">
                <div class="detail-category" id="detailCategory"></div>
                <h1 class="detail-title" id="detailTitle"></h1>
                <div class="detail-meta" id="detailMeta"></div>
                <div class="detail-divider"></div>
                <div class="detail-text" id="detailText"></div>
            </div>
        </div>
        <!-- AI BANNER -->
        <div class="ai-banner" id="aiBanner">
            <div class="ai-banner-header" onclick="toggleAIBanner()">
                <span class="ai-banner-label"><span class="ai-dot"></span> AI Özet & Sohbet</span>
                <button class="btn-summarize" id="btnSummarize" onclick="event.stopPropagation();summarizeNews()">Özetle</button>
            </div>
            <div class="ai-banner-body" id="aiBannerBody"></div>
            <div class="ai-chat-input-row" id="aiChatRow">
                <input type="text" class="ai-chat-input" id="aiChatInput" placeholder="Habere dair bir şey sor..." onkeypress="if(event.key==='Enter')sendAIChat()" autocomplete="off">
                <button class="btn-ai-send" onclick="sendAIChat()">→</button>
            </div>
        </div>
    </div>

    <!-- MODAL OVERLAY -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContainer"></div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ==================== CONFIG ====================
        const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent";
        const ENCRYPTED_KEY = 'A*I*z*a*S*y*B*u*u*l*-*k*g*q*O*K*v*U*h*x*c*6*j*t*Z*T*t*R*R*E*H*X*H*E*n*x*G*8*M';
        const PROXY_URL = "https://wild-sky-08d7.06mmt8129.workers.dev/?url=";

        const fbCfg = {
            apiKey: "AIzaSyBr57bmspJo8r_4IdkBNI_DhULYf0ynCQs",
            databaseURL: "https://gen-lang-client-0253857481-default-rtdb.firebaseio.com",
            projectId: "gen-lang-client-0253857481"
        };

        if (!firebase.apps.length) firebase.initializeApp(fbCfg);
        const db = firebase.database();

        function decryptAPIKey(encrypted) { return encrypted.replace(/\*/g, ''); }

        // ==================== STATE ====================
        let news = [];
        let rssData = {};
        let currentCategory = 'all';
        let visibleCount = parseInt(localStorage.getItem('haberai_visible_count') || '10');
        let savedNews = JSON.parse(localStorage.getItem('haberai_saved') || '[]');
        let disabledSources = JSON.parse(localStorage.getItem('haberai_disabled') || '[]');
        let currentDetailNews = null;
        let detailStarred = false;
        let searchMode = false;
        let searchResults = [];
        let aiBannerOpen = false;
        let aiSummaryText = '';
        let detailContentText = '';
        let rssModalScrollPos = 0;

        const CATEGORIES = ['TÜMÜ', 'TÜRKİYE', 'DÜNYA', 'GÜNDEM', 'TEKNOLOJİ', 'SPOR', 'OTOMOBİL', 'DİĞER'];

        // ==================== CATEGORY NAV ====================
        function renderCategoryNav() {
            const nav = document.getElementById('categoryNav');
            nav.innerHTML = CATEGORIES.map(cat => {
                const val = cat === 'TÜMÜ' ? 'all' : cat;
                const active = val === currentCategory ? ' active' : '';
                return `<button class="cat-btn${active}" data-cat="${val}" onclick="setCategory('${val}', this)">${cat}</button>`;
            }).join('');
        }

        function setCategory(cat, el) {
            currentCategory = cat;
            searchMode = false;
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
            renderNewsList();
        }

        // ==================== FETCH NEWS ====================
        async function fetchAllNews() {
            news = [];
            const cacheKey = 'haberai_news_cache_v3';
            const cacheTimeKey = 'haberai_news_time_v3';
            const cached = localStorage.getItem(cacheKey);
            const cacheTime = localStorage.getItem(cacheTimeKey);
            const now = Date.now();

            if (cached && cacheTime && (now - cacheTime < 30 * 60 * 1000)) {
                news = JSON.parse(cached);
                renderNewsList();
                return;
            }

            if (Object.keys(rssData).length === 0) {
                document.getElementById('newsList').innerHTML =
                    '<div class="empty-state">Henüz RSS kaynağı eklenmedi.<br>Başlığa tıklayarak ekleyebilirsiniz.</div>';
                return;
            }

            document.getElementById('newsList').innerHTML =
                '<div class="loading"><div class="spinner"></div>Haberler yükleniyor...</div>';

            const activeRSS = Object.entries(rssData).filter(([id]) => !disabledSources.includes(id));

            const promises = activeRSS.map(async ([id, rss]) => {
                try {
                    const res = await fetch(PROXY_URL + encodeURIComponent(rss.url));
                    const xmlText = await res.text();
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                    const items = xmlDoc.querySelectorAll('item, entry');

                    items.forEach(el => {
                        const title = el.querySelector('title')?.textContent?.trim() || '';
                        let link = el.querySelector('link')?.textContent ||
                            el.querySelector('link')?.getAttribute('href') || '';
                        const date = el.querySelector('pubDate')?.textContent ||
                            el.querySelector('dc\\:date')?.textContent || '';
                        const desc = el.querySelector('description')?.textContent || '';

                        let img = '';
                        const mediaContent = el.querySelector('media\\:content');
                        if (mediaContent) img = mediaContent.getAttribute('url') || '';
                        if (!img) {
                            const enclosure = el.querySelector('enclosure');
                            if (enclosure && enclosure.getAttribute('type')?.startsWith('image/'))
                                img = enclosure.getAttribute('url') || '';
                        }
                        if (!img && desc) {
                            const m = desc.match(/<img[^>]+src=["']([^"']+)["'][^>]*>/i);
                            if (m) img = m[1];
                        }
                        if (!img && rss.logo) img = rss.logo;

                        if (title.length > 5) {
                            news.push({
                                id: 'n' + Date.now() + Math.random().toString(36).substr(2, 6),
                                title,
                                link,
                                source: rss.ad,
                                category: rss.kategori || 'DİĞER',
                                date,
                                pubDate: date,
                                thumbnail: img,
                                image: img,
                                description: desc.replace(/<[^>]*>/g, '').substring(0, 200),
                            });
                        }
                    });
                } catch (e) { /* sessiz */ }
            });

            await Promise.all(promises);
            news.sort(() => Math.random() - 0.5);
            localStorage.setItem(cacheKey, JSON.stringify(news));
            localStorage.setItem(cacheTimeKey, now);
            renderNewsList();
        }

        function refreshNews() {
            localStorage.removeItem('haberai_news_cache_v3');
            fetchAllNews();
            showToast('🔄 Yenilendi');
        }

        // ==================== SEARCH ====================
        function doSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                searchMode = false;
                renderNewsList();
                return;
            }
            searchMode = true;
            searchResults = news.filter(n =>
                n.title.toLowerCase().includes(query) ||
                n.source.toLowerCase().includes(query) ||
                (n.description && n.description.toLowerCase().includes(query))
            );
            renderSearchResults(query);
        }

        function renderSearchResults(query) {
            const list = document.getElementById('newsList');
            if (searchResults.length === 0) {
                list.innerHTML = `<div class="search-result-count">"${query}" için 0 sonuç</div><div class="empty-state">Eşleşen haber bulunamadı.</div>`;
                return;
            }
            let html = `<div class="search-result-count">"${query}" için ${searchResults.length} sonuç</div><div class="search-results">`;
            html += searchResults.map(n => `
            <div class="search-result-item" onclick="openDetail('${n.id}')">
              ${n.thumbnail ? `<img class="search-result-img" src="${n.thumbnail}" alt="" loading="lazy" onerror="this.style.display='none';">` : ''}
              <div>
                <div class="search-result-title">${n.title}</div>
                <div class="search-result-source">${n.source} · ${timeAgo(n.date)}</div>
              </div>
            </div>
          `).join('');
            html += '</div>';
            list.innerHTML = html;
            list.scrollTop = 0;
        }

        function clearSearch() {
            searchMode = false;
            document.getElementById('searchInput').value = '';
            renderNewsList();
        }

        // ==================== RENDER NEWS ====================
        function renderNewsList() {
            if (searchMode) return;

            let filtered = [...news];
            if (currentCategory !== 'all') filtered = filtered.filter(n => n.category === currentCategory);
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            const displayed = filtered.slice(0, visibleCount);
            const list = document.getElementById('newsList');

            if (displayed.length === 0) {
                list.innerHTML = '<div class="empty-state">Bu kategoride haber bulunamadı.</div>';
                return;
            }

            let html = displayed.map(n => `
            <div class="news-item" onclick="openDetail('${n.id}')">
              ${n.thumbnail ? `<img class="news-img" src="${n.thumbnail}" alt="" loading="lazy" onerror="this.style.display='none';">` : ''}
              <div class="news-content">
                <div class="news-source">${n.source}</div>
                <div class="news-title">${n.title}</div>
                <div class="news-meta">${timeAgo(n.date)}</div>
              </div>
            </div>
          `).join('');

            if (filtered.length > visibleCount) {
                html +=
                    `<div class="load-more"><button class="btn-load" onclick="loadMore()">Daha Fazla (${filtered.length - visibleCount})</button></div>`;
            }

            list.innerHTML = html;
            list.scrollTop = 0;
            updateSavedBadge();
        }

        function loadMore() {
            visibleCount += 10;
            localStorage.setItem('haberai_visible_count', visibleCount);
            renderNewsList();
        }

        function timeAgo(ds) {
            if (!ds) return '';
            const diff = (Date.now() - new Date(ds).getTime()) / 60000;
            if (diff < 1) return 'Az önce';
            if (diff < 60) return Math.floor(diff) + ' dk önce';
            if (diff < 1440) return Math.floor(diff / 60) + ' sa önce';
            return new Date(ds).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
        }

        // ==================== DETAIL ====================
        function openDetail(id) {
            const n = news.find(n => n.id === id);
            if (!n) return;
            currentDetailNews = n;
            detailStarred = savedNews.some(s => s.title === n.title && s.link === n.link);
            aiSummaryText = '';
            detailContentText = '';

            document.getElementById('mainPage').style.display = 'none';
            const dp = document.getElementById('detailPage');
            dp.classList.add('show');
            document.getElementById('detailScroll').scrollTop = 0;

            document.getElementById('detailSource').textContent = n.source;
            document.getElementById('detailImage').src = n.image || '';
            document.getElementById('detailImage').style.display = n.image ? '' : 'none';
            document.getElementById('detailCategory').textContent = (n.category || '').toUpperCase();
            document.getElementById('detailTitle').textContent = n.title;
            document.getElementById('detailMeta').textContent =
                `${n.source} · ${new Date(n.pubDate).toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'})}`;
            document.getElementById('detailText').innerHTML =
                '<p style="color:var(--text-muted);">İçerik yükleniyor...</p>';

            // Reset AI banner
            document.getElementById('aiBannerBody').innerHTML = '';
            document.getElementById('aiBannerBody').classList.remove('show');
            document.getElementById('aiChatRow').classList.remove('show');
            document.getElementById('aiBanner').classList.remove('expanded');
            document.getElementById('btnSummarize').disabled = false;
            document.getElementById('btnSummarize').textContent = 'Özetle';
            aiBannerOpen = false;
            document.getElementById('aiChatInput').value = '';

            updateDetailStarBtn();

            // Fetch full content
            if (n.link) {
                fetch(PROXY_URL + encodeURIComponent(n.link))
                    .then(r => r.text())
                    .then(html => {
                        const doc = new DOMParser().parseFromString(html, 'text/html');
                        const paragraphs = Array.from(doc.querySelectorAll('p'))
                            .map(p => p.textContent.trim())
                            .filter(t => t.length > 40)
                            .slice(0, 6);
                        if (paragraphs.length > 0) {
                            detailContentText = paragraphs.join('\n\n');
                            document.getElementById('detailText').innerHTML =
                                paragraphs.map(p => `<p>${p}</p>`).join('');
                        } else {
                            detailContentText = n.description || '';
                            document.getElementById('detailText').innerHTML =
                                '<p>' + (n.description || 'İçerik bulunamadı.') + '</p>';
                        }
                    })
                    .catch(() => {
                        detailContentText = n.description || '';
                        document.getElementById('detailText').innerHTML =
                            '<p>' + (n.description || 'İçerik yüklenemedi.') + '</p>';
                    });
            } else {
                detailContentText = n.description || '';
            }
        }

        function closeDetail() {
            document.getElementById('detailPage').classList.remove('show');
            document.getElementById('mainPage').style.display = '';
            currentDetailNews = null;
            aiSummaryText = '';
            detailContentText = '';
            aiBannerOpen = false;
            document.getElementById('aiBanner').classList.remove('expanded');
            document.getElementById('aiBannerBody').classList.remove('show');
            document.getElementById('aiChatRow').classList.remove('show');
        }

        function toggleDetailStar() {
            if (!currentDetailNews) return;
            if (detailStarred) {
                savedNews = savedNews.filter(s => !(s.title === currentDetailNews.title && s.link === currentDetailNews
                    .link));
            } else {
                // Tam içerik + AI özetiyle kaydet
                const toSave = {
                    ...currentDetailNews,
                    savedAt: new Date().toISOString(),
                    fullContent: detailContentText,
                    aiSummary: aiSummaryText
                };
                savedNews.push(toSave);
            }
            detailStarred = !detailStarred;
            localStorage.setItem('haberai_saved', JSON.stringify(savedNews));
            updateDetailStarBtn();
            updateSavedBadge();
            showToast(detailStarred ? '★ Kaydedildi' : '☆ Kaldırıldı');
        }

        function updateDetailStarBtn() {
            const btn = document.getElementById('detailStarBtn');
            btn.textContent = detailStarred ? '★' : '☆';
            btn.style.color = detailStarred ? 'var(--star)' : 'var(--text)';
        }

        // ==================== AI BANNER ====================
        function toggleAIBanner() {
            aiBannerOpen = !aiBannerOpen;
            const banner = document.getElementById('aiBanner');
            const body = document.getElementById('aiBannerBody');
            const chatRow = document.getElementById('aiChatRow');

            if (aiBannerOpen) {
                banner.classList.add('expanded');
                body.classList.add('show');
                if (aiSummaryText) chatRow.classList.add('show');
            } else {
                banner.classList.remove('expanded');
                body.classList.remove('show');
                chatRow.classList.remove('show');
            }
        }

        async function summarizeNews() {
            if (!currentDetailNews) return;
            const btn = document.getElementById('btnSummarize');
            const body = document.getElementById('aiBannerBody');
            const chatRow = document.getElementById('aiChatRow');
            const banner = document.getElementById('aiBanner');

            btn.disabled = true;
            btn.textContent = 'Özetleniyor...';

            // Auto-expand
            aiBannerOpen = true;
            banner.classList.add('expanded');
            body.classList.add('show');
            body.innerHTML =
                '<div class="ai-summary-loading"><div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> AI düşünüyor...</div>';

            const fullContent = detailContentText || currentDetailNews.description || '';
            const prompt =
                `Aşağıdaki haberi, en önemli 3-5 madde halinde, her madde en fazla 1 cümle olacak şekilde, Türkçe olarak özetle. Her maddenin başına "🔹" koy:\n\nBaşlık: ${currentDetailNews.title}\n\nİçerik: ${fullContent}`;

            try {
                const res = await fetch(`${GEMINI_URL}?key=${decryptAPIKey(ENCRYPTED_KEY)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: 'user', parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.5, maxOutputTokens: 1024 }
                    })
                });
                const data = await res.json();
                let summary = 'Özet alınamadı.';
                if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    summary = data.candidates[0].content.parts[0].text;
                }
                aiSummaryText = summary;
                body.innerHTML = summary.split('\n').filter(l => l.trim()).map(l =>
                    `<p>${l.replace(/^\s*[\-\*•]\s*/, '🔹 ')}</p>`
                ).join('');
                chatRow.classList.add('show');
                document.getElementById('aiChatInput').focus();

                // Kaydedilmiş haberse AI özetini güncelle
                const savedIdx = savedNews.findIndex(s => s.title === currentDetailNews.title && s.link ===
                    currentDetailNews.link);
                if (savedIdx !== -1) {
                    savedNews[savedIdx].aiSummary = aiSummaryText;
                    savedNews[savedIdx].fullContent = detailContentText;
                    localStorage.setItem('haberai_saved', JSON.stringify(savedNews));
                }

            } catch (e) {
                body.innerHTML = '<p style="color:var(--danger);">Bağlantı hatası, tekrar deneyin.</p>';
            }
            btn.disabled = false;
            btn.textContent = 'Özetle';
        }

        async function sendAIChat() {
            const input = document.getElementById('aiChatInput');
            const text = input.value.trim();
            if (!text || !currentDetailNews) return;

            const body = document.getElementById('aiBannerBody');
            body.innerHTML += `<p style="font-weight:600;margin-top:10px;color:var(--accent);">🟢 Sen: ${text}</p>`;
            input.value = '';
            const typingId = 'aiTyping-' + Date.now();
            body.innerHTML +=
                `<div class="ai-summary-loading" id="${typingId}"><div class="spinner" style="width:14px;height:14px;border-width:2px;"></div> Düşünüyor...</div>`;
            body.scrollTop = body.scrollHeight;
            const banner = document.getElementById('aiBanner');
            banner.classList.add('expanded');
            aiBannerOpen = true;

            const fullContent = detailContentText || currentDetailNews.description || '';
            const prompt =
                `Aşağıdaki haber içeriğine dayanarak sorulan soruyu Türkçe olarak cevapla. Kısa ve net ol:\n\nHaber Başlığı: ${currentDetailNews.title}\n\nHaber İçeriği: ${fullContent}\n\nAI Özeti: ${aiSummaryText}\n\nSoru: ${text}`;

            try {
                const res = await fetch(`${GEMINI_URL}?key=${decryptAPIKey(ENCRYPTED_KEY)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: 'user', parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.7, maxOutputTokens: 1024 }
                    })
                });
                const data = await res.json();
                let cevap = 'Cevap alınamadı.';
                if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    cevap = data.candidates[0].content.parts[0].text;
                }
                const typing = document.getElementById(typingId);
                if (typing) typing.remove();
                body.innerHTML +=
                    `<p style="background:var(--accent-light);padding:10px;border-radius:8px;margin-top:4px;">🤖 ${cevap}</p>`;
                body.scrollTop = body.scrollHeight;
            } catch (e) {
                const typing = document.getElementById(typingId);
                if (typing) typing.remove();
                body.innerHTML += '<p style="color:var(--danger);">Bağlantı hatası!</p>';
            }
        }

        // ==================== SAVED MODAL ====================
        function openSavedModal() {
            let html = '';
            if (savedNews.length === 0) {
                html = '<div class="empty-state">Kayıtlı haber yok.</div>';
            } else {
                html = savedNews.map((n, i) => `
              <div class="saved-item" onclick="openDetailFromSaved(${i});closeModal();">
                <div class="saved-item-info">
                  <div class="saved-item-source">${n.source}</div>
                  <div class="saved-item-title">${n.title}</div>
                </div>
                <button class="btn-icon" style="width:30px;height:30px;font-size:0.7rem;" onclick="event.stopPropagation();deleteSaved(${i})">🗑️</button>
              </div>
            `).join('');
            }
            showModal('☆ Kaydedilenler', html, [{ text: 'Kapat', onClick: 'closeModal()' }]);
        }

        function openDetailFromSaved(i) {
            const n = savedNews[i];
            if (!n) return;
            currentDetailNews = n;
            detailStarred = true;
            aiSummaryText = n.aiSummary || '';
            detailContentText = n.fullContent || n.description || '';

            document.getElementById('mainPage').style.display = 'none';
            const dp = document.getElementById('detailPage');
            dp.classList.add('show');
            document.getElementById('detailScroll').scrollTop = 0;
            document.getElementById('detailSource').textContent = n.source;
            document.getElementById('detailImage').src = n.image || '';
            document.getElementById('detailImage').style.display = n.image ? '' : 'none';
            document.getElementById('detailCategory').textContent = (n.category || '').toUpperCase();
            document.getElementById('detailTitle').textContent = n.title;
            document.getElementById('detailMeta').textContent = n.source + ' · Kaydedildi';

            // Tam içeriği göster
            if (detailContentText) {
                document.getElementById('detailText').innerHTML = detailContentText.split('\n\n').map(p =>
                    `<p>${p}</p>`).join('');
            } else {
                document.getElementById('detailText').innerHTML = '<p>' + (n.description || '') + '</p>';
            }

            // AI özetini göster
            const body = document.getElementById('aiBannerBody');
            const chatRow = document.getElementById('aiChatRow');
            const banner = document.getElementById('aiBanner');
            if (aiSummaryText) {
                body.innerHTML = aiSummaryText.split('\n').filter(l => l.trim()).map(l =>
                    `<p>${l.replace(/^\s*[\-\*•]\s*/, '🔹 ')}</p>`
                ).join('');
                body.classList.add('show');
                chatRow.classList.add('show');
                banner.classList.add('expanded');
                aiBannerOpen = true;
            } else {
                body.innerHTML = '';
                body.classList.remove('show');
                chatRow.classList.remove('show');
                banner.classList.remove('expanded');
                aiBannerOpen = false;
            }
            document.getElementById('btnSummarize').disabled = false;
            document.getElementById('btnSummarize').textContent = 'Özetle';
            document.getElementById('aiChatInput').value = '';
            updateDetailStarBtn();
        }

        function deleteSaved(i) {
            savedNews.splice(i, 1);
            localStorage.setItem('haberai_saved', JSON.stringify(savedNews));
            updateSavedBadge();
            openSavedModal();
            showToast('🗑️ Silindi');
        }

        function updateSavedBadge() {
            const badge = document.getElementById('savedBadge');
            if (savedNews.length > 0) {
                badge.textContent = savedNews.length;
                badge.classList.add('show');
            } else {
                badge.classList.remove('show');
            }
        }

        // ==================== SETTINGS MODAL ====================
        function openSettingsModal() {
            const html = `
            <div class="form-group">
              <label class="form-label">Bir seferde gösterilen haber</label>
              <div style="display:flex;align-items:center;gap:10px;">
                <button class="btn btn-sm" onclick="adjustCount(-5)" style="flex:none;">−</button>
                <span style="font-weight:600;font-size:0.9rem;" id="countDisplay">${visibleCount}</span>
                <button class="btn btn-sm" onclick="adjustCount(5)" style="flex:none;">+</button>
              </div>
            </div>
            <hr style="border:0;border-top:1px solid var(--border);margin:16px 0;">
            <button class="btn" style="width:100%;" onclick="openRSSModal()">📡 RSS Kaynaklarını Yönet</button>
          `;
            showModal('⚙️ Ayarlar', html, [
                { text: 'Tamam', onClick: 'closeModal()', primary: true }
            ]);
        }

        function adjustCount(amount) {
            visibleCount = Math.max(5, Math.min(30, visibleCount + amount));
            localStorage.setItem('haberai_visible_count', visibleCount);
            const display = document.getElementById('countDisplay');
            if (display) display.textContent = visibleCount;
            renderNewsList();
        }

        // ==================== RSS MODAL (scroll korumalı) ====================
        function openRSSModal() {
            let html = '';
            if (Object.keys(rssData).length === 0) {
                html = '<div class="empty-state">Henüz RSS kaynağı yok.</div>';
            } else {
                html = Object.entries(rssData).map(([id, r]) => {
                    const isDisabled = disabledSources.includes(id);
                    return `
                <div class="rss-item" id="rss-item-${id}">
                  <div class="rss-item-info">
                    <span class="rss-item-name">${r.ad}</span>
                    <span class="rss-item-cat">${r.kategori || 'DİĞER'}</span>
                  </div>
                  <div class="rss-item-actions">
                    <button class="btn btn-sm" id="toggle-btn-${id}" style="color:${isDisabled ? 'var(--text-muted)' : 'var(--success)'};" onclick="toggleRSS('${id}')">${isDisabled ? '🔴' : '🟢'}</button>
                    <button class="btn btn-sm" onclick="editRSS('${id}')">✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="confirmDeleteRSS('${id}')">🗑️</button>
                  </div>
                </div>`;
                }).join('');
            }
            showModal('📡 RSS Kaynakları', html, [
                { text: '+ Ekle', onClick: 'openAddRSS()' },
                { text: 'Kapat', onClick: 'closeModal()', primary: true }
            ], true);

            // Scroll pozisyonunu geri yükle
            setTimeout(() => {
                const modalBody = document.querySelector('#modalContainer .modal-body');
                if (modalBody && rssModalScrollPos > 0) {
                    modalBody.scrollTop = rssModalScrollPos;
                }
            }, 100);
        }

        function openAddRSS() {
            const html = `
            <div class="form-group"><label class="form-label">RSS Adı</label><input class="form-input" id="rssName" placeholder="örn: TRT Haber"></div>
            <div class="form-group"><label class="form-label">RSS URL</label><input class="form-input" id="rssUrl" placeholder="https://..."></div>
            <div class="form-group"><label class="form-label">Logo URL (isteğe bağlı)</label><input class="form-input" id="rssLogo" placeholder="https://..."></div>
            <div class="form-group"><label class="form-label">Kategori</label><select class="form-select" id="rssCat">${['TÜRKİYE','DÜNYA','GÜNDEM','TEKNOLOJİ','SPOR','OTOMOBİL','DİĞER'].map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
          `;
            showModal('Yeni RSS Ekle', html, [
                { text: 'İptal', onClick: 'openRSSModal()' },
                { text: 'Kaydet', onClick: 'saveRSS()', primary: true }
            ]);
        }

        function saveRSS() {
            const ad = document.getElementById('rssName')?.value?.trim();
            const url = document.getElementById('rssUrl')?.value?.trim();
            const logo = document.getElementById('rssLogo')?.value?.trim() || '';
            const kat = document.getElementById('rssCat')?.value || 'DİĞER';
            if (!ad || !url) { showToast('Ad ve URL gerekli'); return; }
            db.ref('rss_ayarlari').push({ ad, url, logo, kategori: kat }).then(() => {
                showToast('✅ Eklendi');
                openRSSModal();
            });
        }

        function editRSS(id) {
            const r = rssData[id];
            if (!r) return;
            const html = `
            <div class="form-group"><label class="form-label">RSS Adı</label><input class="form-input" id="editRssName" value="${r.ad}"></div>
            <div class="form-group"><label class="form-label">RSS URL</label><input class="form-input" id="editRssUrl" value="${r.url}"></div>
            <div class="form-group"><label class="form-label">Logo URL</label><input class="form-input" id="editRssLogo" value="${r.logo || ''}"></div>
            <div class="form-group"><label class="form-label">Kategori</label><select class="form-select" id="editRssCat">${['TÜRKİYE','DÜNYA','GÜNDEM','TEKNOLOJİ','SPOR','OTOMOBİL','DİĞER'].map(c=>`<option value="${c}" ${r.kategori===c?'selected':''}>${c}</option>`).join('')}</select></div>
          `;
            showModal('RSS Düzenle', html, [
                { text: 'İptal', onClick: 'openRSSModal()' },
                { text: 'Güncelle', onClick: `updateRSS('${id}')`, primary: true }
            ]);
        }

        function updateRSS(id) {
            const ad = document.getElementById('editRssName')?.value?.trim();
            const url = document.getElementById('editRssUrl')?.value?.trim();
            const logo = document.getElementById('editRssLogo')?.value?.trim() || '';
            const kat = document.getElementById('editRssCat')?.value || 'DİĞER';
            if (!ad || !url) { showToast('Ad ve URL gerekli'); return; }
            db.ref('rss_ayarlari/' + id).update({ ad, url, logo, kategori: kat }).then(() => {
                showToast('✅ Güncellendi');
                openRSSModal();
            });
        }

        function confirmDeleteRSS(id) {
            showModal('🗑️ Silinsin mi?',
                '<p style="text-align:center;padding:20px;">Bu RSS kaynağını silmek istediğine emin misin?</p>', [
                    { text: 'Vazgeç', onClick: 'openRSSModal()' },
                    { text: 'Sil', onClick: `deleteRSS('${id}')`, danger: true }
                ]);
        }

        function deleteRSS(id) {
            db.ref('rss_ayarlari/' + id).remove().then(() => {
                disabledSources = disabledSources.filter(s => s !== id);
                localStorage.setItem('haberai_disabled', JSON.stringify(disabledSources));
                showToast('🗑️ Silindi');
                openRSSModal();
            });
        }

        function toggleRSS(id) {
            // Scroll pozisyonunu kaydet
            const modalBody = document.querySelector('#modalContainer .modal-body');
            if (modalBody) {
                rssModalScrollPos = modalBody.scrollTop;
            }

            if (disabledSources.includes(id)) {
                disabledSources = disabledSources.filter(s => s !== id);
            } else {
                disabledSources.push(id);
            }
            localStorage.setItem('haberai_disabled', JSON.stringify(disabledSources));

            // Butonu anında güncelle, sayfayı yenileme
            const toggleBtn = document.getElementById('toggle-btn-' + id);
            const isDisabled = disabledSources.includes(id);
            if (toggleBtn) {
                toggleBtn.style.color = isDisabled ? 'var(--text-muted)' : 'var(--success)';
                toggleBtn.textContent = isDisabled ? '🔴' : '🟢';
            }

            showToast(isDisabled ? '🔴 Pasif' : '🟢 Aktif');
        }

        // ==================== MODAL SYSTEM ====================
        function showModal(title, bodyHTML, buttons, keepScroll) {
            const container = document.getElementById('modalContainer');
            const footerHTML = buttons.map(b => {
                const cls = b.primary ? ' btn-primary' : (b.danger ? ' btn-danger' : '');
                return `<button class="btn${cls}" onclick="${b.onClick}">${b.text}</button>`;
            }).join('');

            container.innerHTML = `
            <div class="modal-header"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
            <div class="modal-body">${bodyHTML}</div>
            ${buttons.length > 0 ? `<div class="modal-footer">${footerHTML}</div>` : ''}
          `;
            document.getElementById('modalOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            document.body.style.overflow = '';
            rssModalScrollPos = 0;
        }

        // ==================== TOAST ====================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ==================== KEYBOARD ====================
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (document.getElementById('detailPage').classList.contains('show')) {
                    closeDetail();
                } else if (document.getElementById('modalOverlay').classList.contains('show')) {
                    closeModal();
                }
            }
        });

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Search input clear on empty
        document.getElementById('searchInput').addEventListener('input', function() {
            if (!this.value.trim() && searchMode) {
                clearSearch();
            }
        });

                // ==================== PWA ====================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/Gem/sw.js').catch(() => {});
        }

        // ==================== INIT ====================
        function init() {
            renderCategoryNav();
            updateSavedBadge();

            db.ref('rss_ayarlari').on('value', snap => {
                rssData = snap.val() || {};
                if (Object.keys(rssData).length > 0) {
                    fetchAllNews();
                } else {
                    document.getElementById('newsList').innerHTML =
                        '<div class="empty-state">Henüz RSS kaynağı eklenmedi.<br>Başlığa tıklayarak ekleyebilirsiniz.</div>';
                }
            });
        }

        init();
    </script>
</body>
</html>
